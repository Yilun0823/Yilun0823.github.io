<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <title>動態捕捉</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="apple-touch-icon"
        href="https://play-lh.googleusercontent.com/49xvntVrXEhOPKpO0cP6zc2ab6q59NKzlj0HKllSDe3dA4iM24a9nnI1V1a2wYTYF0U=w240-h480-rw">
    <link rel="icon" type="image/png"
        href="https://play-lh.googleusercontent.com/49xvntVrXEhOPKpO0cP6zc2ab6q59NKzlj0HKllSDe3dA4iM24a9nnI1V1a2wYTYF0U=w240-h480-rw">

    <style>
        /* 核心基礎設定 */
        :root {
            --bg-color: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-main: #1c1c1e;
            --text-sub: #8e8e93;
            --accent-blue: #007aff;
            --accent-green: #34c759;
            --modal-bg: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #e0e0e0 0%, transparent 70%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .main-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 毛玻璃卡片風格 */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }

        .header-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--text-sub);
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .status-indicator.active {
            background-color: var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.6);
            }

            70% {
                box-shadow: 0 0 0 12px rgba(52, 199, 89, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(52, 199, 89, 0);
            }
        }

        .status-text {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 8px 0;
        }

        .today-count {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent-blue);
            background: rgba(0, 122, 255, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
        }

        .history-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 12px;
            padding-left: 8px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.6);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .item-index {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-sub);
        }

        .item-time {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        .item-time.viewing {
            color: var(--accent-green);
        }

        .empty-state {
            text-align: center;
            padding: 30px 0;
            color: var(--text-sub);
            font-size: 15px;
            font-weight: 500;
        }

        /* 按鈕群組 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .primary-btn,
        .secondary-btn {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .primary-btn {
            background: var(--accent-blue);
            color: white;
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);
        }

        .primary-btn:active {
            transform: scale(0.97);
            background: #005bb5;
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.6);
            color: var(--accent-blue);
            border: 1px solid rgba(0, 122, 255, 0.1);
        }

        .secondary-btn:active {
            transform: scale(0.97);
            background: rgba(0, 122, 255, 0.1);
        }

        /* =========================================
       彈出視窗 (Modal) 與 月曆導航列
       ========================================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            width: 100%;
            max-width: 340px;
            max-height: 80vh;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(20px) scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* 月曆導航列 */
        .modal-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-title-group h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            min-width: 90px;
            text-align: center;
        }

        .nav-btn {
            background: #e5e5ea;
            color: var(--accent-blue);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .nav-btn:active {
            background: #d1d1d6;
            transform: scale(0.95);
        }

        .nav-btn:disabled {
            color: #c7c7cc;
            background: transparent;
            cursor: default;
            transform: none;
        }

        .close-btn {
            background: #e5e5ea;
            color: #8e8e93;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .close-btn:active {
            background: #d1d1d6;
        }

        .modal-body {
            padding: 15px 20px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .month-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .month-date {
            font-weight: 600;
            color: var(--text-main);
            font-size: 15px;
        }

        .today-tag {
            font-size: 12px;
            color: #8e8e93;
            font-weight: 400;
            margin-left: 4px;
        }

        .month-count {
            font-weight: 700;
            color: var(--accent-blue);
        }

        .month-count.zero {
            color: var(--text-sub);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="glass-card header-section">
            <div class="main-title">目前手機狀態</div>
            <h1 id="statusText" class="status-text">載入中...</h1>
            <div id="todayCount" class="today-count">今天紀錄 0 次</div>
        </div>

        <div>
            <div class="history-title">今天日誌</div>
            <div id="historyList" class="history-list">
            </div>
        </div>

        <div class="btn-group">
            <button class="primary-btn" onclick="fetchData()">重新整理同步</button>
            <button class="secondary-btn" onclick="openModal()">查看歷史紀錄</button>
        </div>
    </div>

    <div id="historyModal" class="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="modal-card">
            <div class="modal-header">

                <div class="modal-title-group">
                    <button class="nav-btn" onclick="changeMonth(-1)">&#10094;</button>
                    <h3 id="modalMonthTitle">載入中</h3>
                    <button class="nav-btn" id="nextMonthBtn" onclick="changeMonth(1)">&#10095;</button>
                </div>

                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalList">
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 你的 Google Apps Script 網址
        const gasBaseUrl = "https://script.google.com/macros/s/AKfycbyVjmdopKbJG6E8tqvWzLEPfAR8b9yb6vvLYnMtBXAEW76H0fYWRRkDNQkVrQtaF3i6/exec";

        // 系統全域變數
        let globalLogs = []; // 把試算表所有資料存在這裡
        let realYear, realMonth, realDay; // 真實的台灣今天日期
        let viewingYear, viewingMonth; // 歷史面板「目前正在查看」的年月

        // 啟動抓取資料
        function fetchData() {
            document.getElementById('statusText').innerText = "同步中...";

            const oldScript = document.getElementById('jsonpScript');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonpScript';
            script.src = `${gasBaseUrl}?callback=handleResponse&_=` + new Date().getTime();
            document.body.appendChild(script);
        }

        // 將時間轉為字串格式
        function getTaiwanDateObj() {
            return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Taipei" }));
        }

        // 接收資料並渲染主畫面
        function handleResponse(data) {
            globalLogs = data.logs || [];

            const twDate = getTaiwanDateObj();
            realYear = twDate.getFullYear();
            realMonth = twDate.getMonth() + 1;
            realDay = twDate.getDate();

            const todayStr = `${realYear}/${String(realMonth).padStart(2, '0')}/${String(realDay).padStart(2, '0')}`;

            // 1. 處理最新狀態指示燈
            const statusTextEl = document.getElementById('statusText');
            const statusDotEl = document.getElementById('statusDot');

            if (globalLogs.length > 0) {
                const lastLog = globalLogs[globalLogs.length - 1];
                if (lastLog.status === "Opened") {
                    statusTextEl.innerText = "查看中";
                    statusDotEl.classList.add("active");
                } else {
                    statusTextEl.innerText = "沒在看";
                    statusDotEl.classList.remove("active");
                }
            } else {
                statusTextEl.innerText = "尚無紀錄";
                statusDotEl.classList.remove("active");
            }

            // 2. 篩選今天資料供首頁排版
            let todayLogs = [];
            globalLogs.forEach(log => {
                const logDateStr = log.time.split(" ")[0];
                if (logDateStr === todayStr) {
                    todayLogs.push(log);
                }
            });

            // 3. 渲染主畫面的 Opened/Closed 對齊
            const historyListEl = document.getElementById('historyList');
            historyListEl.innerHTML = "";
            let pairCount = 0;

            for (let i = 0; i < todayLogs.length; i++) {
                if (todayLogs[i].status === "Opened") {
                    pairCount++;
                    let openTime = todayLogs[i].time.split(" ")[1].substring(0, 5);
                    let closeTime = "查看中";
                    for (let j = i + 1; j < todayLogs.length; j++) {
                        if (todayLogs[j].status === "Closed") {
                            closeTime = todayLogs[j].time.split(" ")[1].substring(0, 5);
                            i = j; break;
                        }
                    }

                    const isViewing = (closeTime === '查看中');
                    const itemHtml = `
            <div class="glass-card history-item" style="padding: 16px;">
              <span class="item-index">第 ${pairCount} 次</span>
              <span class="item-time ${isViewing ? 'viewing' : ''}">${openTime} ~ ${closeTime}</span>
            </div>
          `;
                    historyListEl.insertAdjacentHTML('afterbegin', itemHtml);
                }
            }

            if (pairCount === 0) {
                historyListEl.innerHTML = `<div class="glass-card empty-state">今天尚無紀錄</div>`;
            }
            document.getElementById('todayCount').innerText = `今天紀錄 ${pairCount} 次`;
        }

        // =========================================
        // 歷史紀錄日曆 (Modal) 核心邏輯
        // =========================================
        function openModal() {
            // 每次開啟都先重置回「這個月」
            viewingYear = realYear;
            viewingMonth = realMonth;

            renderModalList();
            document.getElementById('historyModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('historyModal').classList.remove('active');
        }

        function handleOverlayClick(event) {
            if (event.target.id === 'historyModal') closeModal();
        }

        // 切換月份函式
        function changeMonth(direction) {
            viewingMonth += direction;

            // 處理跨年邏輯
            if (viewingMonth < 1) {
                viewingMonth = 12;
                viewingYear--;
            } else if (viewingMonth > 12) {
                viewingMonth = 1;
                viewingYear++;
            }

            renderModalList();
        }

        // 動態渲染指定月份的資料
        function renderModalList() {
            const modalList = document.getElementById('modalList');
            modalList.innerHTML = '';

            // 更新標題
            document.getElementById('modalMonthTitle').innerText = `${viewingYear}年${viewingMonth}月`;

            // 檢查是否為當前真實月份，如果是，就鎖死下一頁 (>) 按鈕
            const nextBtn = document.getElementById('nextMonthBtn');
            const isCurrentMonth = (viewingYear === realYear && viewingMonth === realMonth);
            if (isCurrentMonth) {
                nextBtn.disabled = true;
            } else {
                nextBtn.disabled = false;
            }

            // 準備要篩選的字串 (例如 2026/05)
            const targetMonthStr = `${viewingYear}/${String(viewingMonth).padStart(2, '0')}`;

            // 統計該月的每日開啟次數
            let monthlyDataMap = {};
            globalLogs.forEach(log => {
                const logDateStr = log.time.split(" ")[0];
                const logMonthStr = logDateStr.substring(0, 7);

                if (logMonthStr === targetMonthStr) {
                    if (!monthlyDataMap[logDateStr]) monthlyDataMap[logDateStr] = 0;
                    if (log.status === "Opened") {
                        monthlyDataMap[logDateStr]++;
                    }
                }
            });

            // 決定要迴圈印出幾天：
            // 如果是「這個月」，最多印到今天；如果是「歷史月份」，自動抓取該月最後一天
            let startDay;
            if (isCurrentMonth) {
                startDay = realDay;
            } else {
                // 利用 JavaScript Date 特性，第 0 天會自動退回上個月的最後一天，完美算出當月天數
                startDay = new Date(viewingYear, viewingMonth, 0).getDate();
            }

            // 迴圈由新到舊印出該月每一天
            for (let d = startDay; d >= 1; d--) {
                const dd = String(d).padStart(2, '0');
                const targetDateStr = `${targetMonthStr}/${dd}`;
                const displayDate = `${viewingMonth}月${d}日`;

                const count = monthlyDataMap[targetDateStr] || 0;
                const isZero = count === 0 ? "zero" : "";
                const countText = count === 0 ? "無紀錄" : `${count} 次`;

                // 標註「今天」小標籤
                let todayTag = "";
                if (isCurrentMonth && d === realDay) {
                    todayTag = `<span class="today-tag">(今天)</span>`;
                }

                modalList.insertAdjacentHTML('beforeend', `
          <div class="month-item">
            <span class="month-date">${displayDate} ${todayTag}</span>
            <span class="month-count ${isZero}">${countText}</span>
          </div>
        `);
            }
        }

        // 網頁開啟自動執行同步
        window.onload = fetchData;
    </script>
</body>

</html>
