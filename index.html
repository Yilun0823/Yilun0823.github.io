<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>動態捕捉</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="apple-touch-icon" href="https://play-lh.googleusercontent.com/49xvntVrXEhOPKpO0cP6zc2ab6q59NKzlj0HKllSDe3dA4iM24a9nnI1V1a2wYTYF0U=w240-h480-rw">
  <link rel="icon" type="image/png" href="https://play-lh.googleusercontent.com/49xvntVrXEhOPKpO0cP6zc2ab6q59NKzlj0HKllSDe3dA4iM24a9nnI1V1a2wYTYF0U=w240-h480-rw">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      text-align: center;
      width: 90%;
      max-width: 340px;
    }
    .main-title {
      font-size: 14px;
      color: #86868b;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
    }
    .status-badge {
      font-size: 28px;
      font-weight: 700;
      color: #9e9e9e;
      margin-bottom: 5px;
    }
    .count-badge {
      font-size: 14px;
      color: #0071e3;
      background: #f0f7ff;
      padding: 4px 12px;
      border-radius: 99px;
      display: inline-block;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .history-container {
      background: #f5f5f7;
      border-radius: 16px;
      padding: 15px;
      text-align: left;
      max-height: 220px;
      overflow-y: auto;
    }
    .history-title {
      font-size: 12px;
      color: #86868b;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      padding: 8px 0;
      border-bottom: 1px solid #e8e8ed;
      color: #1d1d1f;
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .item-index {
      color: #86868b;
      font-weight: 500;
    }
    .item-time {
      font-weight: 600;
    }
    .viewing {
      color: #0071e3;
      animation: blink 1.5s infinite;
    }
    @keyframes blink {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .refresh-btn {
      margin-top: 20px;
      background: #0071e3;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .refresh-btn:active {
      background: #005bb5;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="main-title">目前手機狀態</div>
    <div id="statusText" class="status-badge">載入中...</div>
    <div id="todayCount" class="count-badge">本日紀錄 0 次</div>
    
    <div class="history-container">
      <div class="history-title">今日觀測日誌</div>
      <div id="historyList">
        </div>
    </div>
    
    <button class="refresh-btn" onclick="fetchData()">重新整理</button>
  </div>

  <script>
    // ⚠️ 這裡填入你最新部署的 GAS 網址 (後面不需要加任何東西)
    const gasBaseUrl = "https://script.google.com/macros/s/AKfycbwIVOcv5KLZ91HxDnlGowSw19psEgV_Azx0sEO9xc3509QfRaM0VrEBZmbxU7rG0c2n/exec";

    // 發送 JSONP 請求的主函式
    function fetchData() {
      document.getElementById('statusText').innerText = "更新中...";
      
      // 移除可能殘留的舊 script 標籤
      const oldScript = document.getElementById('jsonpScript');
      if (oldScript) oldScript.remove();
      
      // 建立一個全新的 script 標籤，掛上 callback 參數繞過 CORS
      const script = document.createElement('script');
      script.id = 'jsonpScript';
      script.src = `${gasBaseUrl}?callback=handleResponse&_=` + new Date().getTime(); // 加上時間戳防止快取
      document.body.appendChild(script);
    }

    // 當 GAS 成功回傳資料時，會自動觸發執行這個函式
    function handleResponse(data) {
      const logs = data.logs || [];
      const statusEl = document.getElementById('statusText');
      
      // 1. 判斷目前最新狀態
      if (logs.length > 0) {
        const lastLog = logs[logs.length - 1];
        if (lastLog.status === "Opened") {
          statusEl.innerText = "查看中";
          statusEl.style.color = "#0071e3";
          statusEl.classList.add("viewing");
        } else {
          statusEl.innerText = "已退出";
          statusEl.style.color = "#86868b";
          statusEl.classList.remove("viewing");
        }
      } else {
        statusEl.innerText = "尚無紀錄";
      }

      // 2. 篩選台北時間今天的紀錄
      const todayStr = new Date().toLocaleDateString('zh-TW', {timeZone: 'Asia/Taipei'});
      const todayLogs = logs.filter(log => {
        const logDateStr = new Date(log.time).toLocaleDateString('zh-TW', {timeZone: 'Asia/Taipei'});
        return logDateStr === todayStr;
      });

      const historyListEl = document.getElementById('historyList');
      historyListEl.innerHTML = ""; 
      
      let pairCount = 0;
      
      // 3. Opened 與 Closed 配對演算
      for (let i = 0; i < todayLogs.length; i++) {
        if (todayLogs[i].status === "Opened") {
          pairCount++;
          let openTime = todayLogs[i].time.split(" ")[1].substring(0, 5);
          let closeTime = "查看中";
          
          for (let j = i + 1; j < todayLogs.length; j++) {
            if (todayLogs[j].status === "Closed") {
              closeTime = todayLogs[j].time.split(" ")[1].substring(0, 5);
              i = j; 
              break;
            }
          }
          
          const itemHtml = `
            <div class="history-item">
              <span class="item-index">第 ${pairCount} 次</span>
              <span class="item-time ${closeTime === '查看中' ? 'viewing' : ''}">${openTime} ~ ${closeTime}</span>
            </div>
          `;
          historyListEl.insertAdjacentHTML('afterbegin', itemHtml);
        }
      }
      
      if (pairCount === 0) {
        historyListEl.innerHTML = '<div style="color:#86868b;font-size:14px;text-align:center;padding:20px 0;">今日無開啟紀錄</div>';
      }

      // 4. 顯示今日總次數
      document.getElementById('todayCount').innerText = `本日紀錄 ${pairCount} 次`;
    }

    // 網頁開啟自動執行
    window.onload = fetchData;
  </script>
</body>
</html>
