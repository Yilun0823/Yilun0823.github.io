<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>動態捕捉</title>
  
  <!-- 在 github.io 底下，這兩行蘋果專屬標記將會 100% 完美生效，實現純淨 Web Clip 體驗 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="apple-touch-icon" href="https://play-lh.googleusercontent.com/49xvntVrXEhOPKpO0cP6zc2ab6q59NKzlj0HKllSDe3dA4iM24a9nnI1V1a2wYTYF0U=w240-h480-rw">
  <link rel="icon" type="image/png" href="https://play-lh.googleusercontent.com/49xvntVrXEhOPKpO0cP6zc2ab6q59NKzlj0HKllSDe3dA4iM24a9nnI1V1a2wYTYF0U=w240-h480-rw">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      width: 85%;
      max-width: 320px;
    }
    .title {
      font-size: 14px;
      color: #86868b;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .status {
      font-size: 32px;
      font-weight: bold;
      color: #9e9e9e;
      margin-bottom: 20px;
    }
    .time-box {
      background: #f5f5f7;
      padding: 15px;
      border-radius: 12px;
    }
    .time-label {
      font-size: 11px;
      color: #86868b;
      margin-bottom: 4px;
    }
    .time-value {
      font-size: 18px;
      font-weight: 600;
      color: #1d1d1f;
    }
    .refresh-btn {
      margin-top: 20px;
      background: #0071e3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .refresh-btn:active {
      background: #005bb5;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">目前手機狀態</div>
    <div id="statusText" class="status">載入中...</div>
    <div class="time-box">
      <div class="time-label">最後變更時間</div>
      <div id="timeText" class="time-value">Loading...</div>
    </div>
    <button class="refresh-btn" onclick="fetchData()">重新整理</button>
  </div>

  <script>
    // ⚠️ 請填入你最新部署的 Google Apps Script 網址
    const gasUrl = "https://script.google.com/macros/s/AKfycbyVjmdopKbJG6E8tqvWzLEPfAR8b9yb6vvLYnMtBXAEW76H0fYWRRkDNQkVrQtaF3i6/exec";

    function fetchData() {
      document.getElementById('statusText').innerText = "更新中...";
      
      // 向 GAS 發送請求獲取最新試算表資料
      fetch(gasUrl)
        .then(response => response.json())
        .then(data => {
          const statusEl = document.getElementById('statusText');
          statusEl.innerText = data.status;
          document.getElementById('timeText').innerText = data.time;
          
          // 根據狀態動態改變顏色
          if (data.status.includes("Opened")) {
            statusEl.style.color = "#4CAF50";
          } else if (data.status.includes("Closed")) {
            statusEl.style.color = "#F44336";
          } else {
            statusEl.style.color = "#9e9e9e";
          }
        })
        .catch(err => {
          document.getElementById('statusText').innerText = "連線失敗";
          document.getElementById('timeText').innerText = "請檢查網路或GAS權限";
        });
    }

    // 網頁開啟時自動載入一次資料
    window.onload = fetchData;
  </script>
</body>
</html>
